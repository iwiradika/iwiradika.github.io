================ SLIDE 01 — COVER ====================== -->\n        <section data-screen-label=\"01 Cover\" data-label=\"Cover\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w0 }}\"><div style=\"height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 150px; box-sizing:border-box;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:15px; letter-spacing:0.3em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:16px; margin-bottom:38px;\"><span style=\"width:46px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span>COGNITIVE DIAGNOSTIC RESEARCH · 2026<\u002Fspan><\u002Fdiv>\n          <h1 style=\"font-size:68px; font-weight:700; line-height:1.06; letter-spacing:-0.02em; color:#fff; margin:0; max-width:1050px;\">Profiling Digital Competency of Prospective Vocational <span style=\"color:var(--gold,#fcc209);\">IT Educators<\u002Fspan><\u002Fh1>\n          <p style=\"font-size:25px; line-height:1.5; color:#9fb0c9; margin-top:30px; max-width:880px; font-weight:400;\">A cognitive diagnostic approach using the Generalized DINA (G-DINA) model to move from a single score to attribute-level mastery profiles.<\u002Fp>\n          <div style=\"display:flex; gap:56px; margin-top:60px; align-items:flex-end;\">\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.18em; color:#7e90ad; margin-bottom:10px;\">BY<\u002Fdiv>\n              <div style=\"font-size:24px; font-weight:600; color:#fff; line-height:1.3;\">I Nyoman Indhi Wiradika<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.18em; color:#7e90ad; margin-bottom:10px;\">PUBLISHED IN<\u002Fdiv>\n              <div style=\"font-size:17px; color:#e7eaee; line-height:1.5;\">Buletin Ilmiah Sarjana Teknik Elektro · Vol. 8(1) 2026<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n        <!-- ====================== SLIDE 02 — WHY IT MATTERS ====================== -->\n        <section data-screen-label=\"02 Why Diagnose\" data-label=\"Why Diagnose\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w1 }}\"><div style=\"height:100%; display:flex; align-items:center; gap:80px; padding:0 130px; box-sizing:border-box;\">\n          <div style=\"flex:1;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.28em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:14px; margin-bottom:28px;\"><span>01<\u002Fspan><span style=\"width:34px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span style=\"color:#7e90ad;\">THE PROBLEM<\u002Fspan><\u002Fdiv>\n            <h2 style=\"font-size:56px; font-weight:700; line-height:1.06; letter-spacing:-0.015em; color:#fff; margin:0;\">Why diagnose, not just score?<\u002Fh2>\n            <p style=\"font-size:21px; line-height:1.6; color:#9fb0c9; margin-top:28px; max-width:560px;\">Indonesia faces a shortage of digitally competent vocational teachers — yet most instruments report a single aggregate score that <span style=\"color:#fff; font-weight:600;\">cannot reveal which specific competencies are missing.<\u002Fspan><\u002Fp>\n            <p style=\"font-size:21px; line-height:1.6; color:#9fb0c9; margin-top:20px; max-width:560px;\">A cognitive diagnostic model turns one number into a mastery profile teacher-education programs can act on.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:0 0 460px; display:flex; flex-direction:column; gap:22px;\">\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:30px 34px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.16em; color:#7e90ad; margin-bottom:14px;\">CONVENTIONAL SCORING<\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:14px;\"><span style=\"font-size:62px; font-weight:700; color:#5b6f8f; line-height:1;\">68<\u002Fspan><span style=\"font-size:20px; color:#5b6f8f;\">/ 100<\u002Fspan><span style=\"font-size:15px; color:#5b6f8f; margin-left:auto;\">one opaque number<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:center; color:var(--gold,#fcc209); font-size:26px;\">↓<\u002Fdiv>\n            <div style=\"background:rgba(252,194,9,0.08); border:1px solid var(--gold,#fcc209); border-radius:18px; padding:30px 34px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.16em; color:var(--gold,#fcc209); margin-bottom:18px;\">DIAGNOSTIC PROFILE<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:13px;\">\n                <div><div style=\"display:flex; justify-content:space-between; font-size:13px; color:#e7eaee; margin-bottom:5px;\"><span>IT Content Knowledge<\u002Fspan><span style=\"color:var(--gold,#fcc209); font-weight:700;\">Mastered<\u002Fspan><\u002Fdiv><div style=\"height:7px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden;\"><div style=\"width:80%; height:100%; background:var(--gold,#fcc209);\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div><div style=\"display:flex; justify-content:space-between; font-size:13px; color:#e7eaee; margin-bottom:5px;\"><span>Digital Pedagogy<\u002Fspan><span style=\"color:#cdb56b; font-weight:700;\">Not yet<\u002Fspan><\u002Fdiv><div style=\"height:7px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden;\"><div style=\"width:24%; height:100%; background:#cdb56b;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div><div style=\"display:flex; justify-content:space-between; font-size:13px; color:#e7eaee; margin-bottom:5px;\"><span>Digital Professionalism<\u002Fspan><span style=\"color:var(--gold,#fcc209); font-weight:700;\">Mastered<\u002Fspan><\u002Fdiv><div style=\"height:7px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden;\"><div style=\"width:80%; height:100%; background:var(--gold,#fcc209);\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div><div style=\"display:flex; justify-content:space-between; font-size:13px; color:#e7eaee; margin-bottom:5px;\"><span>Digital Social Engagement<\u002Fspan><span style=\"color:var(--gold,#fcc209); font-weight:700;\">Mastered<\u002Fspan><\u002Fdiv><div style=\"height:7px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden;\"><div style=\"width:80%; height:100%; background:var(--gold,#fcc209);\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n        <!-- ====================== SLIDE 03 — THE MODEL / FRAMEWORK ====================== -->\n        <section data-screen-label=\"03 G-DINA Framework\" data-label=\"Framework\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w2 }}\"><div style=\"height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 130px; box-sizing:border-box;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.28em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:14px; margin-bottom:24px;\"><span>02<\u002Fspan><span style=\"width:34px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span style=\"color:#7e90ad;\">THE MODEL<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-size:54px; font-weight:700; line-height:1.05; letter-spacing:-0.015em; color:#fff; margin:0; max-width:980px;\">Four attributes, mapped by the G-DINA Q-matrix<\u002Fh2>\n          <p style=\"font-size:20px; line-height:1.55; color:#9fb0c9; margin-top:22px; max-width:840px;\">The G-DINA model estimates the probability that a test-taker has mastered each latent attribute required to answer an item — producing a binary mastered / not-mastered profile across four competency dimensions.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:46px;\">\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; border-top:3px solid var(--gold,#fcc209);\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold,#fcc209); letter-spacing:0.12em; margin-bottom:14px;\">KTI<\u002Fdiv><div style=\"font-size:19px; font-weight:700; color:#fff; line-height:1.25;\">IT Content Knowledge<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#8da0bd; margin-top:12px;\">Using, developing and managing ICT for educational purposes.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; border-top:3px solid var(--gold,#fcc209);\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold,#fcc209); letter-spacing:0.12em; margin-bottom:14px;\">PD<\u002Fdiv><div style=\"font-size:19px; font-weight:700; color:#fff; line-height:1.25;\">Digital Pedagogy<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#8da0bd; margin-top:12px;\">Designing and evaluating learning that integrates digital technology.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; border-top:3px solid var(--gold,#fcc209);\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold,#fcc209); letter-spacing:0.12em; margin-bottom:14px;\">PRO<\u002Fdiv><div style=\"font-size:19px; font-weight:700; color:#fff; line-height:1.25;\">Digital Professionalism<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#8da0bd; margin-top:12px;\">Ethical, reflective and professional conduct with digital technology.<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:26px; border-top:3px solid var(--gold,#fcc209);\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold,#fcc209); letter-spacing:0.12em; margin-bottom:14px;\">KSD<\u002Fdiv><div style=\"font-size:19px; font-weight:700; color:#fff; line-height:1.25;\">Digital Social Engagement<\u002Fdiv><div style=\"font-size:14px; line-height:1.5; color:#8da0bd; margin-top:12px;\">Building socio-professional relationships through digital technology.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n        <!-- ====================== SLIDE 04 — STUDY DESIGN ====================== -->\n        <section data-screen-label=\"04 Study Design\" data-label=\"Study Design\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w3 }}\"><div style=\"height:100%; display:flex; align-items:center; gap:80px; padding:0 130px; box-sizing:border-box;\">\n          <div style=\"flex:0 0 420px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.28em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:14px; margin-bottom:28px;\"><span>03<\u002Fspan><span style=\"width:34px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span style=\"color:#7e90ad;\">METHOD<\u002Fspan><\u002Fdiv>\n            <h2 style=\"font-size:54px; font-weight:700; line-height:1.06; letter-spacing:-0.015em; color:#fff; margin:0;\">How the study was run<\u002Fh2>\n            <p style=\"font-size:20px; line-height:1.6; color:#9fb0c9; margin-top:26px; max-width:400px;\">A cross-sectional survey of informatics-education students, analyzed with a multi-stage psychometric pipeline.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:22px;\">\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px;\"><div style=\"font-size:56px; font-weight:700; color:var(--gold,#fcc209); line-height:1;\">270<\u002Fdiv><div style=\"font-size:16px; color:#e7eaee; margin-top:10px;\">informatics-education students<\u002Fdiv><div style=\"font-size:13px; color:#7e90ad; margin-top:4px;\">purposive sample · 70.7% male<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px;\"><div style=\"font-size:56px; font-weight:700; color:var(--gold,#fcc209); line-height:1;\">32<\u002Fdiv><div style=\"font-size:16px; color:#e7eaee; margin-top:10px;\">validated items<\u002Fdiv><div style=\"font-size:13px; color:#7e90ad; margin-top:4px;\">refined from a 54-item pool<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px;\"><div style=\"font-size:56px; font-weight:700; color:var(--gold,#fcc209); line-height:1;\">4<\u002Fdiv><div style=\"font-size:16px; color:#e7eaee; margin-top:10px;\">competency attributes<\u002Fdiv><div style=\"font-size:13px; color:#7e90ad; margin-top:4px;\">KTI · PD · PRO · KSD<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:28px;\"><div style=\"font-size:30px; font-weight:700; color:#fff; line-height:1.2; margin-top:6px;\">CTT · CFA · G‑DINA<\u002Fdiv><div style=\"font-size:16px; color:#e7eaee; margin-top:12px;\">multi-stage analysis<\u002Fdiv><div style=\"font-size:13px; color:#7e90ad; margin-top:4px;\">classical → factor → diagnostic<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n        <!-- ====================== SLIDE 1 — ADMIN DASHBOARD ====================== -->\n        <section data-screen-label=\"05 Admin Dashboard\" data-label=\"Admin Dashboard\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w4 }}\"><div style=\"height:100%; display:flex; align-items:center; gap:60px; padding:0 96px; box-sizing:border-box;\">\n          <div style=\"width:330px; flex:0 0 330px; color:#fff;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.28em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:14px; margin-bottom:26px;\"><span>05<\u002Fspan><span style=\"width:34px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span style=\"color:#7e90ad;\">PELITA · ADMIN<\u002Fspan><\u002Fdiv>\n            <h2 style=\"font-size:54px; font-weight:700; line-height:1.04; letter-spacing:-0.015em; margin:0;\">Admin Dashboard<\u002Fh2>\n            <p style=\"font-size:19px; line-height:1.55; color:#9fb0c9; margin-top:24px; max-width:320px;\">A single command center for users, items, assessments and review queues.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 auto; max-width:820px; height:640px; background:#f4f6fa; border-radius:16px; overflow:hidden; box-shadow:0 40px 80px -24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06); display:flex; flex-direction:column;\">\n            <div style=\"height:46px; flex:0 0 46px; background:var(--navy,#032454); display:flex; align-items:center; padding:0 18px; gap:9px;\"><span style=\"width:11px; height:11px; border-radius:50%; background:var(--gold,#fcc209);\"><\u002Fspan><span style=\"width:11px; height:11px; border-radius:50%; background:#46587a;\"><\u002Fspan><span style=\"width:11px; height:11px; border-radius:50%; background:#46587a;\"><\u002Fspan><span style=\"margin-left:14px; background:rgba(255,255,255,0.08); color:#9fb0c9; font-family:'IBM Plex Mono',monospac =\"font-size:20px; font-weight:700; color:#fff;\">Female students outperformed males<\u002Fdiv><div style=\"font-size:15px; color:#8da0bd; margin-top:4px;\">consistently, across all four dimensions — countering proficiency stereotypes.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:24px 28px; display:flex; align-items:center; gap:24px;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--gold,#fcc209); letter-spacing:0.1em; flex:0 0 96px;\">TRAJECTORY<\u002Fdiv><div><div style=\"font-size:20px; font-weight:700; color:#fff;\">A non-linear dip in semester 3<\u002Fdiv><div style=\"font-size:15px; color:#8da0bd; margin-top:4px;\">a significant decline followed by recovery — a critical transition point for support.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(252,194,9,0.08); border:1px solid var(--gold,#fcc209); border-radius:16px; padding:24px 28px; display:flex; align-items:center; gap:24px;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--gold,#fcc209); letter-spacing:0.1em; flex:0 0 96px;\">DOMAINS<\u002Fdiv><div><div style=\"font-size:20px; font-weight:700; color:#fff;\">Digital Pedagogy strongest; IT Content &amp; Social Engagement variable<\u002Fdiv><div style=\"font-size:15px; color:#e7eaee; margin-top:4px;\">pinpointing exactly where curricular attention should go.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n        <!-- ====================== SLIDE 12 — CONCLUSION ====================== -->\n        <section data-screen-label=\"12 Conclusion\" data-label=\"Conclusion\" style=\"width:1440px; height:900px; flex:0 0 1440px; position:relative;\"><div style=\"{{ w11 }}\"><div style=\"height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 150px; box-sizing:border-box;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.28em; color:var(--gold,#fcc209); display:flex; align-items:center; gap:14px; margin-bottom:30px;\"><span>06<\u002Fspan><span style=\"width:34px; height:1px; background:rgba(252,194,9,0.6);\"><\u002Fspan><span style=\"color:#7e90ad;\">CONCLUSION<\u002Fspan><\u002Fdiv>\n          <h2 style=\"font-size:60px; font-weight:700; line-height:1.07; letter-spacing:-0.018em; color:#fff; margin:0; max-width:1000px;\">A robust diagnostic tool for <span style=\"color:var(--gold,#fcc209);\">targeted<\u002Fspan> teacher preparation<\u002Fh2>\n          <p style=\"font-size:21px; line-height:1.55; color:#9fb0c9; margin-top:24px; max-width:880px;\">The G-DINA-based instrument reliably identifies specific learning needs — enabling programs to intervene during critical transition periods instead of reacting to a single final grade.<\u002Fp>\n          <div style=\"display:flex; gap:26px; margin-top:42px; align-items:stretch;\">\n            <div style=\"background:#fff; border-radius:18px; padding:22px; display:flex; align-items:center; gap:22px; box-shadow:0 20px 50px -22px rgba(0,0,0,0.55);\">\n              <img src=\"170718a7-b3ba-472e-94b9-6c2c78840ecc\" alt=\"QR PELITA\" style=\"width:128px; height:128px; display:block; border-radius:8px;\">\n              <div style=\"max-width:210px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#b88a00; margin-bottom:8px;\">ACCESS THE PLATFORM<\u002Fdiv>\n                <div style=\"font-size:20px; font-weight:700; color:var(--navy,#032454); line-height:1.2;\">Try PELITA<\u002Fdiv>\n                <div style=\"font-size:12px; color:#64748b; margin-top:8px; word-break:break-all; font-family:'IBM Plex Mono',monospace;\">landingpage-pelita.vercel.app<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff; border-radius:18px; padding:22px; display:flex; align-items:center; gap:22px; box-shadow:0 20px 50px -22px rgba(0,0,0,0.55);\">\n              <img src=\"e64f4f1a-017c-495d-b557-7600e2f37d2f\" alt=\"QR Publikasi\" style=\"width:128px; height:128px; display:block; border-radius:8px;\">\n              <div style=\"max-width:210px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; color:#b88a00; margin-bottom:8px;\">READ THE PUBLICATION<\u002Fdiv>\n                <div style=\"font-size:20px; font-weight:700; color:var(--navy,#032454); line-height:1.2;\">Scopus Record<\u002Fdiv>\n                <div style=\"font-size:12px; color:#64748b; margin-top:8px; word-break:break-all; font-family:'IBM Plex Mono',monospace;\">scopus.com · 105031721817<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n      <\u002Fdiv>\n\n      <!-- CHROME -->\n      <div style=\"position:absolute; top:34px; left:96px; z-index:6; display:flex; align-items:center; gap:18px;\">\n        <img src=\"189c88f9-7a48-46e0-810e-aa53e349b04c\" alt=\"Undiksha\" style=\"height:52px; width:auto; display:block;\">\n        <span style=\"width:1px; height:38px; background:rgba(255,255,255,0.18);\"><\u002Fspan>\n        <img src=\"a7159c02-940d-468a-be1b-93c35d196024\" alt=\"PELITA\" style=\"height:54px; width:auto; display:block;\">\n        <div style=\"margin-left:2px;\"><div style=\"font-size:18px; font-weight:700; color:#fff; letter-spacing:0.04em; line-height:1;\">PELITA<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; color:#7e90ad; letter-spacing:0.12em; margin-top:3px;\">DIGITAL COMPETENCY ASSESSMENT<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; top:50px; right:96px; z-index:6; font-family:'IBM Plex Mono',monospace; font-size:15px; color:#9fb0c9; letter-spacing:0.1em;\">{{ counterText }}<\u002Fdiv>\n\n      <div style=\"position:absolute; bottom:48px; left:50%; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:10px;\">\n        <sc-for list=\"{{ dots }}\" as=\"dot\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ dot.onClick }}\" style=\"{{ dot.style }}\"><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; bottom:42px; right:96px; z-index:6; display:flex; gap:12px;\">\n        <button onclick=\"{{ prev }}\" style=\"width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s;\" style-hover=\"background:rgba(255,255,255,0.16)\">←<\u002Fbutton>\n        <button onclick=\"{{ next }}\" style=\"width:50px; height:50px; border-radius:50%; border:1px solid var(--gold,#fcc209); background:var(--gold,#fcc209); color:var(--navy,#032454); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.2s;\" style-hover=\"transform:scale(1.06)\">→<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 },\n  &quot;primaryColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#032454&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#fcc209&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;neutralColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#e7eaee&quot;, &quot;tsType&quot;: &quot;string&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { index: 0 };\n\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n    this.scalerRef = React.createRef();\n    this._lock = false;\n  }\n\n  componentDidMount() {\n    this._fit();\n    this._onResize = () => this._fit();\n    window.addEventListener('resize', this._onResize);\n\n    this._onKey = (e) => {\n      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); this.next(); }\n      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); this.prev(); }\n    };\n    window.addEventListener('keydown', this._onKey);\n\n    this._onWheel = (e) => {\n      e.preventDefault();\n      if (this._lock) return;\n      const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;\n      if (Math.abs(d) < 8) return;\n      this._lock = true;\n      if (d > 0) this.next(); else this.prev();\n      setTimeout(() => { this._lock = false; }, 780);\n    };\n    if (this.rootRef.current) this.rootRef.current.addEventListener('wheel', this._onWheel, { passive: false });\n\n    try {\n      const saved = parseInt(localStorage.getItem('pelita-slide'), 10);\n      if (!isNaN(saved) && saved >= 0 && saved <= 11) this.setState({ index: saved });\n    } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('keydown', this._onKey);\n    if (this.rootRef.current) this.rootRef.current.removeEventListener('wheel', this._onWheel);\n  }\n\n  _fit() {\n    const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);\n    if (this.scalerRef.current) this.scalerRef.current.style.transform = `scale(${s})`;\n  }\n\n  _setIndex(i) {\n    const idx = Math.max(0, Math.min(11, i));\n    this.setState({ index: idx });\n    try { localStorage.setItem('pelita-slide', String(idx)); } catch (e) {}\n  }\n\n  next() { this._setIndex(this.state.index + 1); }\n  prev() { this._setIndex(this.state.index - 1); }\n  goTo(i) { this._setIndex(i); }\n\n  renderVals() {\n    const i = this.state.index;\n    const TOTAL = 12;\n    const dots = Array.from({ length: TOTAL }, (_, n) => ({\n      onClick: () => this.goTo(n),\n      style: n === i\n        ? 'width:30px; height:8px; border-radius:999px; background:var(--gold,#fcc209); border:none; padding:0; cursor:pointer; transition:all 0.4s;'\n        : 'width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,0.28); border:none; padding:0; cursor:pointer; transition:all 0.4s;'\n    }));\n    // morph reveal: active slide settles in, neighbours scale/blur/fade out\n    const morph = {};\n    for (let n = 0; n < TOTAL; n++) {\n      const active = n === i;\n      morph['w' + n] = active\n        ? 'height:100%; opacity:1; transform:scale(1); filter:blur(0); transition:opacity 0.7s ease 0.18s, transform 0.85s cubic-bezier(0.22,1,0.36,1) 0.1s, filter 0.6s ease 0.18s;'\n        : 'height:100%; opacity:0; transform:scale(0.945); filter:blur(7px); transition:opacity 0.4s ease, transform 0.5s ease, filter 0.4s ease;';\n    }\n    const pad = (x) => (x < 10 ? '0' + x : '' + x);\n    return {\n      rootRef: this.rootRef,\n      scalerRef: this.scalerRef,\n      navy: this.props.primaryColor ?? '#032454',\n      gold: this.props.accentColor ?? '#fcc209',\n      silver: this.props.neutralColor ?? '#e7eaee',\n      trackX: `${-i * 1440}px`,\n      counterText: `${pad(i + 1)} / ${pad(TOTAL)}`,\n      next: () => this.next(),\n      prev: () => this.prev(),\n      dots,\n      ...morph\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
